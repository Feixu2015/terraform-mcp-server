name: CI

on:
  push:
    branches: [ main, opentofu ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/gopath/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: |
          go mod download

      - name: Run unit tests
        run: |
          go test ./... -v

      - name: Run e2e tests
        # e2e tests require docker; GitHub runners include docker
        run: |
          echo "Running e2e tests"
          go test ./e2e -v
        env:
          # Allow tests to find registry or other tooling if needed
          TFE_ADDRESS: ${{ secrets.TFE_ADDRESS }}
          TFE_TOKEN: ${{ secrets.TFE_TOKEN }}
